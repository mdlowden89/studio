# Defines the data model for the User Profiles.

type Query {
  userProfiles: [UserProfile!]
}

"""
Represents a user's profile in the application.
"""
type UserProfile @table(name: "user_profiles") {
  id: String! @column(name: "id", primaryKey: true)
  name: String! @column(name: "name")
  age: Int! @column(name: "age")
  bio: String! @column(name: "bio")
  images: [String!]! @column(name: "images", type: "json")
  vibeTags: [String!]! @column(name: "vibe_tags", type: "json")
  locationPatterns: [String!] @column(name: "location_patterns", type: "json")
  prompts: [PromptAnswer!]! @column(name: "prompts", type: "json")
  email: String @column(name: "email")
  work: String @column(name: "work")
  jobTitle: String @column(name: "job_title")
  education: String @column(name: "education")
  ethnicity: String @column(name: "ethnicity")
  childrenStatus: String @column(name: "children_status")
  familyPlans: String @column(name: "family_plans")
  height: String @column(name: "height")
  locationAddress: String @column(name: "location_address")
  locationName: String @column(name: "location_name")
  locationCoordinates: Coordinates @column(name: "location_coordinates", type: "json")
  drinking: String @column(name: "drinking")
  smoking: String @column(name: "smoking")
  zodiacSign: String @column(name: "zodiac_sign")
  achievements: [Achievement!] @column(name: "achievements", type: "json")
  onboardingComplete: Boolean! @column(name: "onboarding_complete")
}

"""
A user's answer to a profile prompt. Stored as JSON.
"""
type PromptAnswer {
  promptId: String!
  answer: String!
}

"""
Geographic coordinates. Stored as JSON.
"""
type Coordinates {
  lat: Float!
  lng: Float!
}

"""
An achievement unlocked by a user. Stored as JSON.
"""
type Achievement {
  id: String!
  name: String!
  type: String!
  description: String!
  icon: String!
  achievedDate: String
  rewards: [String!]!
  glowEffect: Boolean
}
